<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Weather — Live Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🛰️ Star Weather</h1>
      <p class="subtitle">Live conditions for any city on Earth, powered by Open-Meteo — no API key required.</p>
    </header>

    <form id="search-form" class="search-form" autocomplete="off">
      <input
        type="text"
        id="city-input"
        placeholder="Search for a city (e.g. Tokyo, Cairo, São Paulo)"
        aria-label="City name"
      />
      <button type="submit" id="search-btn">Search</button>
      <button type="button" id="location-btn" title="Use my current location">📍 My Location</button>
    </form>

    <ul id="suggestions" class="suggestions" hidden></ul>

    <p id="status-msg" class="status-msg" role="status"></p>

    <section id="dashboard" class="dashboard" hidden>
      <div class="current-card">
        <div class="current-main">
          <span id="current-icon" class="current-icon">☀️</span>
          <span id="current-temp" class="current-temp">--°</span>
        </div>
        <div class="current-details">
          <h2 id="current-place">--</h2>
          <p id="current-condition">--</p>
          <div class="stat-row">
            <span>Feels like <strong id="current-feels">--°</strong></span>
            <span>Humidity <strong id="current-humidity">--%</strong></span>
            <span>Wind <strong id="current-wind">-- km/h</strong></span>
          </div>
          <p class="updated-at" id="updated-at"></p>
        </div>
      </div>

      <div class="unit-toggle">
        <button type="button" id="unit-toggle-btn" class="ghost-btn">Show in °F</button>
      </div>

      <h3>5-Day Forecast</h3>
      <div id="forecast-list" class="forecast-list"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
